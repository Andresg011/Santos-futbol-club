<!DOCTYPE html>
<html lang="es">
<head>
    <!-- =========================
         CONFIGURACIÓN BÁSICA
         ========================= -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugadores - Escuela Santos</title>

    <!-- =========================
         ENLACE A TU CSS GLOBAL
         ========================= -->
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <!-- =========================
         HEADER (NO MODIFICAR)
         ========================= -->
    <header>
        <img src="santos-logo/santos-logo.svg" alt="Escudo Escuela Santos" width="180" height="180">
        <h1>Escuela de Fútbol Santos</h1>
        <p>Formando talento y disciplina </p>
    </header>

    <!-- =========================
         MENÚ DE NAVEGACIÓN
         ========================= -->
    <nav>
        <a href="index.html">Inicio</a>
        <a href="jugadores.html">Jugadores</a>
        <a href="inscripcion.html">Inscripción</a>
        <a href="tienda.html">Tienda</a>
        <a href="pagos.html">Pagos</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <!-- =========================
         SECCIÓN PRINCIPAL JUGADORES
         ========================= -->
    <section class="jugadores-section">

        <!-- =========================
             CONTROLES DE BÚSQUEDA Y FILTRO
             ========================= -->
        <div class="jugadores-controles">

            <!-- ===== LADO IZQUIERDO: CATEGORÍAS ===== -->
            <div class="filtro-categoria">

                <select id="categorias">
                    <option value="todos">Todas las categorías</option>
                    <option value="sub10">Sub 10</option>
                    <option value="sub12">Sub 12</option>
                    <option value="sub15">Sub 15</option>
                </select>

            </div>

            <!-- ===== LADO DERECHO: BUSCADOR ===== -->
            <div class="buscador-jugador">

                <input 
                    type="text" 
                    id="buscador" 
                    placeholder="Buscar jugador por nombre..."
                >

            </div>

        </div>

        <!-- =========================
             CONTENEDOR DINÁMICO
             ========================= -->
        <div id="jugadores" class="jugadores-grid"></div>

    </section>

    <!-- =========================
         MODAL DETALLE DEL JUGADOR
         ========================= -->
    <div id="modalJugador" class="modal-jugador">

        <div class="modal-contenido">

            <!-- Botón cerrar -->
            <span id="cerrarModal">&times;</span>

            <!-- Contenido dinámico -->
            <div id="detalleJugador"></div>

        </div>

    </div>

    <!-- =========================
         SCRIPT JS
         ========================= -->
    <script src="js/jugadores.js"></script>

</body>
</html>
