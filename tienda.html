<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tienda - Escuela Santos</title>

    <!-- Estilos globales del proyecto -->
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

<!-- ================= HEADER PRINCIPAL ================= -->
<header>

    <!-- Logo de la escuela -->
    <img src="santos-logo/santos-logo.svg" alt="Escudo Escuela Santos" width="180" height="180">

    <!-- Nombre de la escuela -->
    <h1>Escuela de Fútbol Santos</h1>

    <!-- Frase institucional -->
    <p>Formando talento y disciplina</p>

</header>

<!-- ================= MENÚ DE NAVEGACIÓN ================= -->
<nav>

    <a href="index.html">Inicio</a>
    <a href="jugadores.html">Jugadores</a>
    <a href="inscripcion.html">Inscripción</a>
    <a href="tienda.html">Tienda</a>
    <a href="pagos.html">Pagos</a>
    <a href="contacto.html">Contacto</a>

</nav>

<!-- ================= TITULO TIENDA ================= -->
<section>
    <h2>Tienda Oficial</h2>
    <p>Compra uniformes y artículos deportivos oficiales de la escuela</p>
</section>

<!-- ================= PRODUCTOS ================= -->
<section class="productos">

    <!-- Producto 1 -->
    <div class="producto">
        <h3>Camiseta Oficial</h3>
        <p>$50.000</p>
        <button onclick="agregarAlCarrito('Camiseta Oficial', 50000)">
            Agregar al carrito
        </button>
    </div>

    <!-- Producto 2 -->
    <div class="producto">
        <h3>Pantaloneta</h3>
        <p>$35.000</p>
        <button onclick="agregarAlCarrito('Pantaloneta', 35000)">
            Agregar al carrito
        </button>
    </div>

    <!-- Producto 3 -->
    <div class="producto">
        <h3>Medias</h3>
        <p>$15.000</p>
        <button onclick="agregarAlCarrito('Medias', 15000)">
            Agregar al carrito
        </button>
    </div>

</section>

<!-- ================= CARRITO ================= -->
<section class="carrito">

    <h2>Carrito de compras</h2>

    <!-- Lista dinámica de productos -->
    <ul id="lista-carrito"></ul>

    <!-- Total acumulado -->
    <h3>Total: $<span id="total">0</span></h3>

    <!-- Botón final WhatsApp -->
    <button onclick="enviarWhatsApp()">
        Finalizar compra
    </button>

</section>

<!-- ================= JS ================= -->
<script src="js/tienda.js"></script>

</body>
</html>
