<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Permite que la página sea responsive en móviles y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título de la pestaña del navegador -->
    <title>Tienda - Escuela Santos</title>

    <!-- Estilos globales del proyecto -->
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

<!-- ================= HEADER PRINCIPAL ================= -->
<header>

    <!-- Logo de la escuela -->
    <img src="santos-logo/santos-logo.svg" alt="Escudo Escuela Santos" width="180" height="180">

    <!-- Nombre de la escuela -->
    <h1>Escuela de Fútbol Santos</h1>

    <!-- Frase institucional -->
    <p>Formando talento y disciplina</p>

</header>


<!-- ================= MENÚ DE NAVEGACIÓN ================= -->
<nav>

    <a href="index.html">Inicio</a>
    <a href="jugadores.html">Jugadores</a>
    <a href="inscripcion.html">Inscripción</a>
    <a href="tienda.html">Tienda</a>
    <a href="pagos.html">Pagos</a>
    <a href="contacto.html">Contacto</a>

</nav>


<!-- ================= TITULO TIENDA ================= -->
<section>
    <h2>Tienda Oficial</h2>
    <p>Compra uniformes y artículos deportivos oficiales de la escuela</p>
</section>


<!-- ================= PRODUCTOS ================= -->
<section class="productos">

    <!-- ================= CAMISETA ================= -->
    <div class="producto">

        <!-- Imagen del producto -->
        <img src="img/camiseta.jpg" alt="Camiseta oficial Escuela Santos">

        <!-- Nombre del producto -->
        <h3>Camiseta Oficial</h3>

        <!-- Precio -->
        <p>$50.000</p>

        <!-- Botón agregar al carrito -->
        <button onclick="agregarAlCarrito('Camiseta Oficial', 50000, 'img/camiseta.jpg')">
            Agregar al carrito
        </button>
    </div>


    <!-- ================= PANTALONETA ================= -->
    <div class="producto">

        <img src="img/pantaloneta.jpg" alt="Pantaloneta Escuela Santos">

        <h3>Pantaloneta</h3>

        <p>$35.000</p>

        <button onclick="agregarAlCarrito('Pantaloneta', 35000, 'img/pantaloneta.jpg')">
            Agregar al carrito
        </button>
    </div>


    <!-- ================= MEDIAS ================= -->
    <div class="producto">

        <img src="img/medias.jpg" alt="Medias Escuela Santos">

        <h3>Medias</h3>

        <p>$15.000</p>

        <button onclick="agregarAlCarrito('Medias', 15000, 'img/medias.jpg')">
            Agregar al carrito
        </button>
    </div>

</section>


<!-- ================= CARRITO ================= -->
<section class="carrito">

    <h2>Carrito de compras</h2>

    <!-- Lista dinámica del carrito -->
    <ul id="lista-carrito"></ul>

    <!-- Total acumulado -->
    <h3>Total: $<span id="total">0</span></h3>

    <!-- Botón final para enviar pedido -->
    <button onclick="enviarWhatsApp()">
        Finalizar compra
    </button>

</section>


<!-- ================= JS ================= -->
<script src="js/tienda.js"></script>

</body>
</html>
